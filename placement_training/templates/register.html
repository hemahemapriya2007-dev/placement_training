{% extends 'base.html' %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 120px);">
    <div class="col-md-6">
        <div class="card border-0 rounded-4">
            <div class="card-body p-5">
                <h3 class="text-center mb-4" style="font-weight: 800; letter-spacing: 0.5px;">Create Your Account</h3>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CGPA</label>
                            <input type="number" step="0.01" name="cgpa" class="form-control" value="0" placeholder="3.5">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Backlogs</label>
                            <input type="number" name="backlog_count" class="form-control" value="0" placeholder="0">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control" placeholder="Computer Science">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" name="year" class="form-control" min="1" max="8" placeholder="4">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter a strong password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
                    <div class="text-center mt-4">
                        <p style="color: var(--text-secondary);">Already have an account? <a href="{{ url_for('auth.student_login') }}" style="color: var(--neon-cyan); font-weight: 600;">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
