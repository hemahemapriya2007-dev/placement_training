{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 120px);">
    <div class="col-md-5">
        <div class="card border-0 rounded-4">
            <div class="card-body p-5">
                <h3 class="text-center mb-4" style="font-weight: 800; letter-spacing: 0.5px;">Admin Portal</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Login as Admin</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
